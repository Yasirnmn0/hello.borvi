<section class="py-16 md:py-20 bg-[#f6f6f6] overflow-hidden">
  <app-container>
    <div class="max-w-4xl mx-auto">
      <div appFadeIn class="bg-white shadow-md rounded-2xl p-6 md:p-8">
        <h2 class="text-xl md:text-2xl font-bold text-center mb-10">
          {{ 'home.preview.title' | translate }}
          <span class="text-[#1ea672]">{{ 'home.preview.titleHighlight' | translate }}</span>
        </h2>
        <div class="grid grid-cols-2 sm:grid-cols-4 gap-6 relative">
          @for (step of steps; track step.titleKey; let index = $index) {
            <div
              appFadeIn
              [delay]="index * 100"
              class="flex flex-col items-center text-center hover:-translate-y-1.5 transition-transform"
            >
              <div
                class="w-14 h-14 md:w-16 md:h-16 bg-[#f1f5f3] rounded-full shadow flex items-center justify-center overflow-hidden"
              >
                <app-image
                  [src]="step.image"
                  [alt]="step.titleKey | translate"
                  [width]="40"
                  [height]="40"
                  className="object-contain"
                />
              </div>
              <div
                class="w-6 h-6 mt-2 rounded-full bg-[#0F3D2E] text-white text-xs flex items-center justify-center"
              >
                {{ index + 1 }}
              </div>
              <h4 class="mt-3 text-xs md:text-sm font-semibold text-[#1b1b1b]">
                {{ step.titleKey | translate }}
              </h4>
              <p class="text-[11px] md:text-xs text-gray-500 mt-1 max-w-[120px]">
                {{ step.descKey | translate }}
              </p>
            </div>
          }
        </div>
      </div>
    </div>
  </app-container>
</section>
