<div class="vp-auth-card" appFadeIn [y]="24" [duration]="600">
  <h2 class="text-2xl font-extrabold text-[#111827] tracking-tight">{{ 'auth.login.title' | translate }}</h2>
  <p class="mt-2 text-sm text-gray-500 leading-relaxed">{{ 'auth.login.subtitle' | translate }}</p>

  @if (error()) {
    <div class="mt-5 rounded-xl border border-red-200 bg-red-50 px-4 py-3 text-sm text-red-700" role="alert">
      {{ error() }}
    </div>
  }

  <button type="button" (click)="signInWithGoogle()" [disabled]="loading()" class="vp-auth-google mt-6">
    <svg class="h-5 w-5 shrink-0" viewBox="0 0 24 24" aria-hidden="true">
      <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" />
      <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" />
      <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" />
      <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" />
    </svg>
    {{ 'auth.login.google' | translate }}
  </button>

  <div class="vp-divider"><span>{{ 'auth.login.divider' | translate }}</span></div>

  <form [formGroup]="form" (ngSubmit)="onSubmit()" class="space-y-1">
    <app-vendor-field
      formControlName="email"
      [label]="'auth.login.email' | translate"
      type="email"
      icon="mail"
      [placeholder]="'auth.login.emailPlaceholder' | translate"
      autocomplete="email"
      [animationDelay]="100"
    />
    <app-vendor-field
      formControlName="password"
      [label]="'auth.login.password' | translate"
      type="password"
      icon="lock"
      [placeholder]="'auth.login.passwordPlaceholder' | translate"
      autocomplete="current-password"
      [animationDelay]="160"
    />

    <label class="flex items-center gap-2.5 py-3 cursor-pointer" appFadeIn [delay]="220">
      <input type="checkbox" formControlName="remember" class="h-4 w-4 rounded border-gray-300 text-[#0d7a52] focus:ring-[#0d7a52]" />
      <span class="text-sm text-gray-600">{{ 'auth.login.remember' | translate }}</span>
    </label>

    <div class="text-right mb-4">
      <a routerLink="/forgot-password" class="text-xs font-semibold text-[#0d7a52] hover:underline">Forgot password?</a>
    </div>

    <button type="submit" [disabled]="loading()" class="vp-btn vp-btn--primary w-full mt-2" appFadeIn [delay]="280">
      @if (loading()) {
        <svg lucideLoader2 class="vp-btn__spin" [size]="18"></svg>
      }
      {{ 'auth.login.submit' | translate }}
    </button>
  </form>

  <p class="mt-8 text-center text-sm text-gray-500" appFadeIn [delay]="340">
    {{ 'auth.login.noAccount' | translate }}
    <a routerLink="/signup" class="font-bold text-[#0d7a52] hover:underline ml-1">{{ 'auth.login.signupLink' | translate }}</a>
  </p>

  <p class="mt-4 text-center text-xs text-gray-400" appFadeIn [delay]="400">{{ 'auth.login.demoHint' | translate }}</p>
</div>
