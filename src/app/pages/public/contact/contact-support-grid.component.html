<section class="w-full max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12">
  <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
    <div
      appFadeIn
      class="bg-[#f2f8f5] rounded-3xl p-6 flex items-center justify-between gap-6 relative overflow-hidden group border border-neutral-100/50 hover:-translate-y-1.5 transition-transform"
    >
      <div class="space-y-4 max-w-[65%] relative z-10">
        <div class="space-y-1.5">
          <h3 class="text-lg font-black text-[#032f19] tracking-tight">
            {{ "CONTACT.SUPPORT.HELP.TITLE" | translate }}
          </h3>
          <p class="text-xs text-neutral-500 leading-relaxed">
            {{ "CONTACT.SUPPORT.HELP.DESCRIPTION" | translate }}
          </p>
        </div>
        <button
          type="button"
          class="inline-flex items-center gap-2 text-xs font-bold text-white bg-[#0c7a4b] hover:bg-[#0a663e] rounded-xl px-4 py-3 shadow-md shadow-[#0c7a4b]/10 transition-colors"
        >
          <svg lucideMessageSquareCode class="w-3.5 h-3.5" [size]="14"></svg>
          {{ "CONTACT.SUPPORT.HELP.BUTTON" | translate }}
        </button>
      </div>
      <div
        class="absolute right-4 bottom-4 w-[120px] h-[120px] md:w-[180px] md:h-[180px] bg-[#0c7a4b]/5 rounded-full flex items-center justify-center group-hover:bg-[#0c7a4b]/10 transition-colors duration-300"
      >
        <svg
          lucideBot
          class="w-1/2 h-1/2 text-[#0c7a4b] group-hover:scale-110 transition-transform duration-300"
          [size]="64"
        ></svg>
      </div>
    </div>

    <div
      appFadeIn
      [delay]="100"
      class="bg-neutral-50/60 rounded-3xl p-6 flex items-center justify-between gap-6 relative overflow-hidden group border border-neutral-100 hover:-translate-y-1.5 transition-transform"
    >
      <div class="space-y-4 max-w-[60%] relative z-10">
        <div class="space-y-1.5">
          <h3 class="text-lg font-black text-[#032f19] tracking-tight">
            {{ "CONTACT.SUPPORT.EQUIPMENT.TITLE" | translate }}
          </h3>
          <p class="text-xs text-neutral-500 leading-relaxed">
            {{ "CONTACT.SUPPORT.EQUIPMENT.DESCRIPTION" | translate }}
          </p>
        </div>
        <button
          type="button"
          (click)="exploreEquipment()"
          class="inline-flex items-center gap-2 text-xs font-bold text-[#0c7a4b] bg-white hover:bg-[#0c7a4b] hover:text-white border border-[#0c7a4b]/20 rounded-xl px-4 py-3 transition-all"
        >
          {{ "CONTACT.SUPPORT.EQUIPMENT.BUTTON" | translate }}
          <svg
            lucideArrowUpRight
            class="w-3.5 h-3.5 stroke-[2.5]"
            [size]="14"
          ></svg>
        </button>
      </div>
      <div class="flex items-end gap-4 pr-2">
        <div class="relative w-[130px] h-[100px]">
          <app-image
            src="/images/Genrator.png"
            alt="Generator"
            [fill]="true"
            className="object-contain translate-y-2 group-hover:translate-y-0 transition-transform duration-300"
          />
        </div>
        <div class="relative w-[130px] h-[100px]">
          <app-image
            src="/images/Lawn-mower.png"
            alt="Lawn Mower"
            [fill]="true"
            className="object-contain translate-y-2 group-hover:translate-y-0 transition-transform duration-300"
          />
        </div>
      </div>
    </div>
  </div>
</section>
