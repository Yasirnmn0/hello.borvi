<section class="w-full bg-[#f6f6f6] px-10 lg:py-6 overflow-hidden">
  <div class="grid grid-cols-1 lg:grid-cols-12 gap-8 lg:gap-12 items-center">
    <div appFadeIn class="lg:col-span-5 pl-12 space-y-10">
      <span
        class="text-[#0c7a4b] font-semibold text-xs md:text-sm uppercase tracking-wider bg-[#0c7a4b]/10 px-2.5 py-1 rounded inline-block"
      >
        {{ "HOW_IT_WORKS.HEADER.BADGE" | translate }}
      </span>
      <app-hero-text
        size="lg"
        [description]="'HOW_IT_WORKS.HEADER.DESCRIPTION' | translate"
      >
        <span heroTitle>
          {{ "HOW_IT_WORKS.HEADER.TITLE_PART1" | translate }} <br />
          {{ "HOW_IT_WORKS.HEADER.TITLE_PART2" | translate }}
          <span class="text-[#0c7a4b]">
            {{ "HOW_IT_WORKS.HEADER.TITLE_HIGHLIGHT" | translate }}
          </span>
        </span>
      </app-hero-text>
    </div>

    <div
      appFadeIn
      class="lg:col-span-7 relative w-full h-[300px] sm:h-[400px] lg:h-[480px]"
    >
      <div class="borvi-float w-full h-full">
        <app-image
          src="/images/HowHero.png"
          alt="Borvi Application interface walkthrough"
          [fill]="true"
          [priority]="true"
          className="object-contain p-4 object-center"
        />
      </div>
    </div>
  </div>
</section>
