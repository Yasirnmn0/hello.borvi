<section class="bg-[#f6f6f6] overflow-hidden">
  <div class="w-full max-w-7xl mx-auto px-10 pb-10">
    <div
      appFadeIn
      class="relative overflow-hidden rounded-2xl px-8 py-6 bg-gradient-to-r from-[#063d2a] to-[#0c7a4b] text-white flex flex-col md:flex-row items-center justify-between gap-8"
    >
      <div class="relative hidden md:block w-[220px] borvi-float">
        <app-image
          src="/images/DownloadApp/app-preview.png"
          alt="App Preview"
          [width]="220"
          [height]="160"
          className="object-contain"
        />
      </div>
      <div class="flex-1">
        <h3 class="text-xl md:text-2xl font-bold">
          {{ "HOW_IT_WORKS.CTA.TITLE" | translate }}
        </h3>
        <p class="text-sm text-white/80 mt-1">
          {{ "HOW_IT_WORKS.CTA.DESCRIPTION" | translate }}
        </p>
      </div>
      <div class="flex items-center gap-6">
        <div class="hidden md:block h-12 w-[1px] bg-white/20"></div>
        <div class="bg-white p-2 rounded-lg">
          <app-image
            src="/images/DownloadApp/QR-Techrefi.png"
            alt="QR Code"
            [width]="80"
            [height]="80"
          />
        </div>
        <div class="flex flex-col gap-3">
          <app-image
            src="/images/DownloadApp/googleplay-Eng.svg"
            alt="Google Play"
            [width]="140"
            [height]="40"
            className="h-[40px] w-auto"
          />
          <app-image
            src="/images/DownloadApp/Apple-Eng.svg"
            alt="App Store"
            [width]="140"
            [height]="40"
            className="h-[40px] w-auto"
          />
        </div>
      </div>
    </div>
  </div>
</section>
